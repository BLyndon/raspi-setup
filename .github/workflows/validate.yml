name: Validate IaC Configuration

on:
  push:
    branches: [main, develop]
    paths:
      - "ansible/**"
      - "terraform/**"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ansible/**"
      - "terraform/**"

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Lint Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Ansible and ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Run ansible-lint
        run: |
          ansible-lint ansible/site.yml

  ansible-syntax-check:
    name: Check Ansible Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Syntax check
        run: |
          ansible-playbook ansible/site.yml -i ansible/hosts.ini.example --syntax-check

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform format check
        run: |
          cd terraform
          terraform fmt -check

      - name: Terraform validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "table"
          output: "trivy-results.txt"
          hide-progress: true
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Publish Trivy results to workflow summary
        if: always()
        run: |
          {
            echo "### Trivy Misconfiguration Scan"
            echo ""
            echo "High and critical findings from repository infrastructure configuration."
            echo ""
            echo "<details><summary>Show scan output</summary>"
            echo ""
            echo '```text'
            if [[ -f trivy-results.txt ]]; then
              cat trivy-results.txt
            else
              echo "Trivy did not produce an output file."
            fi
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs:
      [ansible-lint, ansible-syntax-check, terraform-validate, security-scan]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.ansible-lint.result }}" == "failure" || \
                "${{ needs.ansible-syntax-check.result }}" == "failure" || \
                "${{ needs.terraform-validate.result }}" == "failure" || \
                "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo "❌ Some validations failed. Please review the checks above."
            exit 1
          else
            echo "✅ All validations passed!"
          fi

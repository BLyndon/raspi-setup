name: Validate IaC Configuration

on:
  push:
    branches: [main, develop]
    paths:
      - "ansible/**"
      - "terraform/**"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ansible/**"
      - "terraform/**"

permissions:
  contents: read
  security-events: write

jobs:
  ansible-lint:
    name: Lint Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Ansible and ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Run ansible-lint
        run: |
          ansible-lint ansible/site.yml

  ansible-syntax-check:
    name: Check Ansible Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Syntax check
        run: |
          ansible-playbook ansible/site.yml -i ansible/hosts.ini.example --syntax-check

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform format check
        run: |
          cd terraform
          terraform fmt -check

      - name: Terraform validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          sarif_file: "trivy-results.sarif"

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [ansible-lint, ansible-syntax-check, terraform-validate]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.ansible-lint.result }}" == "failure" || \
                "${{ needs.ansible-syntax-check.result }}" == "failure" || \
                "${{ needs.terraform-validate.result }}" == "failure" ]]; then
            echo "❌ Some validations failed. Please review the checks above."
            exit 1
          else
            echo "✅ All validations passed!"
          fi

# WiFi Repeater role - Configure hostapd and dnsmasq for WiFi repeating
# Prerequisites: network role (for network configuration)
#
# Hardened for reliability:
# - Ensures services restart on failure
# - Disables WiFi power management
# - Ensures iptables rules persist
# - Adds interface health check

- name: Validate repeater interface configuration
  ansible.builtin.import_tasks: steps/validate.yml

- name: Install WiFi repeater dependencies
  ansible.builtin.import_tasks: steps/packages.yml

- name: Interface setup
  ansible.builtin.import_tasks: steps/interface.yml

- name: Configuration files
  ansible.builtin.import_tasks: steps/config.yml

- name: Firewall and forwarding
  ansible.builtin.import_tasks: steps/firewall.yml

- name: Interface runtime setup
  ansible.builtin.import_tasks: steps/interface_runtime.yml

- name: Service management
  ansible.builtin.import_tasks: steps/services.yml

- name: Debug output
  ansible.builtin.import_tasks: steps/debug.yml

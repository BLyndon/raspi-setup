- name: Allow forwarding from WireGuard interface
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ wireguard_interface | default('wg0') }}"
    jump: ACCEPT
    state: present
  when:
    - wireguard_manage_firewall | default(true) | bool
    - wireguard_firewall_allow_forward | default(true) | bool
    - not ansible_check_mode
  tags: [wireguard, firewall]

- name: Allow inbound traffic on WireGuard interface
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: "{{ wireguard_interface | default('wg0') }}"
    jump: ACCEPT
    state: present
  when:
    - wireguard_manage_firewall | default(true) | bool
    - not ansible_check_mode
  tags: [wireguard, firewall]

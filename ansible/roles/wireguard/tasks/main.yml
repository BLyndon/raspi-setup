---


# WireGuard role - Install and configure a WireGuard interface (refactored)

- name: Validate WireGuard configuration
  ansible.builtin.import_tasks: steps/validate.yml

- name: Install WireGuard packages
  ansible.builtin.import_tasks: steps/install_packages.yml

- name: Ensure WireGuard config directory exists
  ansible.builtin.import_tasks: steps/ensure_config_dir.yml

- name: Check for existing private key file
  ansible.builtin.import_tasks: steps/check_private_key_file.yml

- name: Generate WireGuard private key
  ansible.builtin.import_tasks: steps/generate_private_key.yml

- name: Persist WireGuard private key
  ansible.builtin.import_tasks: steps/persist_private_key.yml

- name: Read WireGuard private key
  ansible.builtin.import_tasks: steps/read_private_key.yml

- name: Set effective WireGuard private key
  ansible.builtin.import_tasks: steps/set_effective_private_key.yml

- name: Derive WireGuard public key
  ansible.builtin.import_tasks: steps/derive_public_key.yml

- name: Configure WireGuard interface
  ansible.builtin.import_tasks: steps/configure_interface.yml

- name: Enable IPv4 forwarding
  ansible.builtin.import_tasks: steps/enable_ipv4_forwarding.yml

- name: Allow UDP port for WireGuard
  ansible.builtin.import_tasks: steps/allow_udp_port.yml

- name: Allow inbound WireGuard interface
  ansible.builtin.import_tasks: steps/allow_inbound_interface.yml

- name: Allow forwarding for WireGuard
  ansible.builtin.import_tasks: steps/allow_forwarding.yml

- name: Allow established forwarding for WireGuard
  ansible.builtin.import_tasks: steps/allow_established_forwarding.yml

- name: Enable and start WireGuard interface
  ansible.builtin.import_tasks: steps/enable_start_interface.yml

- name: Restart WireGuard interface
  ansible.builtin.import_tasks: steps/restart_interface.yml

- name: Verify WireGuard status
  ansible.builtin.import_tasks: steps/verify_status.yml

- name: Display WireGuard summary
  ansible.builtin.import_tasks: steps/display_summary.yml

# --- DuckDNS dynamic DNS updater ---

- name: Ensure DuckDNS directory exists
  ansible.builtin.import_tasks: steps/duckdns_ensure_dir.yml

- name: Deploy DuckDNS update script
  ansible.builtin.import_tasks: steps/duckdns_deploy_script.yml

- name: Schedule DuckDNS updater cron job
  ansible.builtin.import_tasks: steps/duckdns_schedule_cron.yml

- name: Run DuckDNS updater now
  ansible.builtin.import_tasks: steps/duckdns_run_now.yml
